plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = project.archives_base_name + '-' + project.minecraft_version
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        url = 'https://masa.dy.fi/maven/sakura-ryoko'
        content { includeGroupAndSubgroups('fi.dy.masa') }
    }
    maven {
        url = 'https://maven.fallenbreath.me/releases'
        content { includeGroupAndSubgroups('me.fallenbreath') }
    }
    maven { url 'https://maven.wispforest.io' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // 以支持 mp3 播放
    implementation("javazoom:jlayer:1.0.1")
    // MP3SPI，用于解码mp3文件
    implementation("com.googlecode.soundlibs:mp3spi:1.9.5.4")
    // Tritonus Share，提供音频处理服务
    implementation("com.googlecode.soundlibs:tritonus-share:0.3.7.4")
    // JFlac Codec，用于解码flac文件
    implementation("org.jflac:jflac-codec:1.5.2")
    // ZXing Core，用于二维码处理
    implementation("com.google.zxing:core:3.5.1")
    include("javazoom:jlayer:1.0.1")
    include("com.googlecode.soundlibs:mp3spi:1.9.5.4")
    include("com.googlecode.soundlibs:tritonus-share:0.3.7.4")
    include("org.jflac:jflac-codec:1.5.2")
    include("com.google.zxing:core:3.5.1")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": minecraft_version,
                "malilib_version": malilib_version.split("-").last()
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    from("LICENSE")
}
